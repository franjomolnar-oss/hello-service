apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-service-production
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://github.com/franjomolnar-oss/hello-service.git
    targetRevision: main
    path: helm/hello-service
    helm:
      releaseName: hello-service
      values: |
        replicaCount: 3
        image:
          repository: hello-service
          tag: "1.0.0"
          pullPolicy: IfNotPresent
        service:
          port: 80
          targetPort: 3000
        app:
          nodeEnv: production
          version: "1.0.0"
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        probes:
          liveness:
            initialDelaySeconds: 15
            periodSeconds: 20
          readiness:
            initialDelaySeconds: 10
            periodSeconds: 15
      parameters:
        - name: image.tag
          value: "1.0.0"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
